trigger:
  branches:
    include:
      - master

variables:
  buildConfiguration: 'Release'
  dotnetSdk: '9.0.x'
  outputDir: '$(Build.ArtifactStagingDirectory)/publish'
  azureSubscription: 'ASP-CTSHIPDashboardrg-a4c4 (P0v4: 1)'
  webAppName: 'ctship-app'

stages:
  - stage: Build
    displayName: Build
    jobs:
      - job: Build
        displayName: Restore, build and publish
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: UseDotNet@2
            displayName: 'Use .NET SDK $(dotnetSdk)'
            inputs:
              packageType: sdk
              version: '$(dotnetSdk)'

          - script: dotnet restore
            displayName: Restore

          - script: dotnet build --configuration $(buildConfiguration) --no-restore
            displayName: Build

          - script: dotnet publish --configuration $(buildConfiguration) --no-build --output $(outputDir)
            displayName: Publish

          - task: PublishPipelineArtifact@1
            displayName: Upload deployment artifact
            inputs:
              targetPath: '$(outputDir)'
              artifact: drop

  - stage: Deploy
    displayName: Deploy
    dependsOn: Build
    jobs:
      - deployment: DeployWeb
        displayName: Deploy to Azure Web App
        environment: production
        pool:
          vmImage: 'ubuntu-latest'
        strategy:
          runOnce:
            deploy:
              steps:
                - download: current
                  artifact: drop

                - task: AzureCLI@2
                  displayName: Configure Azure SQL and migration settings
                  inputs:
                    azureSubscription: '$(azureSubscription)'
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      if [ -z "$AZURE_SQL_CONNECTION_STRING" ]; then
                        echo "Secret pipeline variable AzureSqlConnectionString is required."
                        exit 1
                      fi

                      resource_group=$(az webapp list --query "[?name=='$WEB_APP_NAME'].resourceGroup | [0]" --output tsv)
                      if [ -z "$resource_group" ]; then
                        echo "Azure Web App '$WEB_APP_NAME' was not found."
                        exit 1
                      fi

                      az webapp config connection-string set --resource-group "$resource_group" --name "$WEB_APP_NAME" --connection-string-type SQLAzure --settings "DefaultConnection=$AZURE_SQL_CONNECTION_STRING" --output none
                      az webapp config appsettings set --resource-group "$resource_group" --name "$WEB_APP_NAME" --settings "ASPNETCORE_ENVIRONMENT=Production" "Database__ApplyMigrationsOnStartup=true" --output none
                  env:
                    AZURE_SQL_CONNECTION_STRING: $(AzureSqlConnectionString)
                    WEB_APP_NAME: $(webAppName)

                - task: AzureWebApp@1
                  displayName: Deploy Azure Web App
                  inputs:
                    azureSubscription: '$(azureSubscription)'
                    appType: webApp
                    appName: '$(webAppName)'
                    package: '$(Pipeline.Workspace)/drop'
                    deploymentMethod: auto

                - bash: |
                    health_url="https://$(webAppName).azurewebsites.net/health"
                    for attempt in {1..12}; do
                      if curl --fail --silent --show-error --max-time 30 "$health_url"; then
                        echo "Application and Azure SQL are healthy."
                        exit 0
                      fi

                      echo "Health check attempt $attempt failed."
                      sleep 10
                    done

                    echo "Application health check failed after deployment."
                    exit 1
                  displayName: Verify application and database health
