services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ctship-sqlserver
    environment:
      ACCEPT_EULA: Y
      SA_PASSWORD: "YourPassword123!"
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourPassword123!' -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ctship-dashboard:
    image: ctshipdashboard:latest
    container_name: ctship-dashboard
    depends_on:
      sqlserver:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Database__ApplyMigrationsOnStartup: "true"
      Security__RequireHttps: "false"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=CTSHIPDashboard;User Id=sa;Password=YourPassword123!;MultipleActiveResultSets=true;TrustServerCertificate=True;Encrypt=False;"
    volumes:
      - ./App_Data:/app/App_Data
    restart: unless-stopped

volumes:
  sqlserver_data:
