name: Build and deploy .NET Core application to Web App CTSHIPDashboard
on:
  push:
    branches:
    - master
env:
  AZURE_WEBAPP_NAME: CTSHIPDashboard01
  AZURE_WEBAPP_PACKAGE_PATH: .\published
  AZURE_RESOURCE_GROUP: CTSHIPDashboard-rg
  AZURE_CLIENT_ID: 02f88a60-838b-42d4-a0fd-47f80f91d435
  AZURE_SUBSCRIPTION_ID: 48f0bdd5-c2ad-49e6-9d29-de518760e273
  AZURE_TENANT_ID: a1ccc802-5840-44b8-aa3f-52fcd6fc2c5a
  CONFIGURATION: Release
  DOTNET_CORE_VERSION: 9.0.x
  WORKING_DIRECTORY: .
jobs:
  build:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_CORE_VERSION }}
    - name: Restore
      run: dotnet restore "${{ env.WORKING_DIRECTORY }}"
    - name: Build
      run: dotnet build "${{ env.WORKING_DIRECTORY }}" --configuration ${{ env.CONFIGURATION }} --no-restore
    - name: Test
      run: dotnet test "${{ env.WORKING_DIRECTORY }}" --configuration ${{ env.CONFIGURATION }} --no-build
    - name: Publish
      run: dotnet publish "${{ env.WORKING_DIRECTORY }}" --configuration ${{ env.CONFIGURATION }} --no-build --output "${{ env.AZURE_WEBAPP_PACKAGE_PATH }}"
    - name: Publish Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: webapp
        path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
  deploy:
    runs-on: windows-latest
    needs: build
    steps:
    - name: Download artifact from build job
      uses: actions/download-artifact@v4
      with:
        name: webapp
        path: ${{ env.AZURE_WEBAPP_PACKAGE_PATH }}
    - name: Azure CLI Login
      shell: pwsh
      env:
        AZURE_CREDENTIALS: ${{ secrets.CTSHIPDASHBOARD_SPN }}
      run: |
        if ([string]::IsNullOrWhiteSpace($env:AZURE_CREDENTIALS)) {
          throw "GitHub secret CTSHIPDASHBOARD_SPN is missing. Add it in Settings > Secrets and variables > Actions."
        }

        try {
          $credentials = $env:AZURE_CREDENTIALS | ConvertFrom-Json
        }
        catch {
          throw "GitHub secret CTSHIPDASHBOARD_SPN must be valid JSON."
        }

        $requiredFields = @("clientId", "clientSecret", "subscriptionId", "tenantId")
        foreach ($field in $requiredFields) {
          if ([string]::IsNullOrWhiteSpace($credentials.$field)) {
            throw "GitHub secret CTSHIPDASHBOARD_SPN is missing required field '$field'."
          }
        }

        if ($credentials.clientId -ne $env:AZURE_CLIENT_ID) {
          throw "GitHub secret CTSHIPDASHBOARD_SPN has the wrong clientId for the NEDC Azure app registration."
        }
        if ($credentials.subscriptionId -ne $env:AZURE_SUBSCRIPTION_ID) {
          throw "GitHub secret CTSHIPDASHBOARD_SPN has the wrong subscriptionId for CTSHIPDashboard01."
        }
        if ($credentials.tenantId -ne $env:AZURE_TENANT_ID) {
          throw "GitHub secret CTSHIPDASHBOARD_SPN has the wrong tenantId for the NEDC work account tenant."
        }

        az cloud set -n AzureCloud
        az login `
          --service-principal `
          --username $env:AZURE_CLIENT_ID `
          --password $credentials.clientSecret `
          --tenant $env:AZURE_TENANT_ID `
          --output none
        az account set --subscription $env:AZURE_SUBSCRIPTION_ID
        az account show --query "{subscription:name, subscriptionId:id, tenantId:tenantId}" --output table
        az webapp show `
          --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" `
          --name "${{ env.AZURE_WEBAPP_NAME }}" `
          --query "{app:name, resourceGroup:resourceGroup, state:state}" `
          --output table
    - name: Package Web App
      shell: pwsh
      run: |
        $zipPath = Join-Path $env:RUNNER_TEMP "webapp.zip"
        if (Test-Path $zipPath) {
          Remove-Item $zipPath -Force
        }
        Compress-Archive -Path "${{ env.AZURE_WEBAPP_PACKAGE_PATH }}\*" -DestinationPath $zipPath
        "ZIP_PATH=$zipPath" | Out-File -FilePath $env:GITHUB_ENV -Append
    - name: Deploy to Azure WebApp
      shell: pwsh
      run: |
        az webapp deployment source config-zip `
          --resource-group "${{ env.AZURE_RESOURCE_GROUP }}" `
          --name "${{ env.AZURE_WEBAPP_NAME }}" `
          --src "$env:ZIP_PATH"
