name: Build and deploy ASP.Net Core app to Azure Web App - ctship-app

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  PUBLISH_DIR: ${{ runner.temp }}/myapp

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Locate web project
        id: find
        run: |
          $proj = Get-ChildItem -Path . -Recurse -Filter *.csproj -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          if (-not $proj) { Write-Error 'No .csproj found'; exit 1 }
          echo "PROJECT_PATH=$proj" >> $GITHUB_ENV
          Write-Host "Found project: $proj"

      - name: Build with dotnet
        run: dotnet build "$PROJECT_PATH" --configuration Release --no-restore

      - name: dotnet publish
        run: dotnet publish "$PROJECT_PATH" -c Release -o "${{ env.PUBLISH_DIR }}" --no-build

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-app
          path: ${{ env.PUBLISH_DIR }}

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: dotnet-app
          path: ./dotnet-app

      - name: Login to Azure (Service Principal)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.CTSHIPDASHBOARD_SPN }}
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_73176ACE1737405EB918EC9FD48EEC6D }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_D39C03C20BD24641AD8A1898411E9C6A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B5263CAECF004CB7A65F8BB3B2DB517A }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ctship-app'
          slot-name: 'Production'
          package: ./dotnet-app
