name: Build and deploy ASP.NET Core app to Azure Web App - ctship-app

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  DOTNET_VERSION: '9.0.x'
  WEB_APP_NAME: 'ctship-app'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish
        run: dotnet publish .\CTSHIPDashboard.csproj --configuration Release --no-build --output "${{ runner.temp }}/publish"

      - name: Validate publish output
        shell: pwsh
        run: |
          $publishPath = "${{ runner.temp }}/publish"
          $requiredFiles = @(
            "web.config",
            "CTSHIPDashboard.dll",
            "CTSHIPDashboard.runtimeconfig.json"
          )

          foreach ($file in $requiredFiles) {
            $filePath = Join-Path $publishPath $file
            if (-not (Test-Path -LiteralPath $filePath -PathType Leaf)) {
              throw "Publish output is missing required root file: $file"
            }
          }

          Write-Host "Publish output root contains the Azure web.config and application DLL."

      - name: Package Azure deployment
        shell: pwsh
        run: Compress-Archive -Path "${{ runner.temp }}/publish/*" -DestinationPath "${{ runner.temp }}/ctship-app.zip" -Force

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{ runner.temp }}/ctship-app.zip

  deploy:
    runs-on: windows-latest
    needs: build
    environment:
      name: production
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: deployment

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.CTSHIPDASHBOARD_SPN }}

      - name: Configure Azure SQL and migration settings
        shell: pwsh
        env:
          AZURE_SQL_CONNECTION_STRING: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AZURE_SQL_CONNECTION_STRING)) {
            throw "Repository secret AZURE_SQL_CONNECTION_STRING is required."
          }

          $resourceGroup = az webapp list --query "[?name=='$env:WEB_APP_NAME'].resourceGroup | [0]" --output tsv
          if ([string]::IsNullOrWhiteSpace($resourceGroup)) {
            throw "Azure Web App '$env:WEB_APP_NAME' was not found."
          }

          az webapp config set --resource-group $resourceGroup --name $env:WEB_APP_NAME --always-on true --http20-enabled true --output none
          az webapp update --resource-group $resourceGroup --name $env:WEB_APP_NAME --https-only true --output none
          az webapp config connection-string set --resource-group $resourceGroup --name $env:WEB_APP_NAME --connection-string-type SQLAzure --settings "DefaultConnection=$env:AZURE_SQL_CONNECTION_STRING" --output none
          az webapp config appsettings set --resource-group $resourceGroup --name $env:WEB_APP_NAME --settings "ASPNETCORE_ENVIRONMENT=Production" "Database__ApplyMigrationsOnStartup=true" "ASPNETCORE_FORWARDEDHEADERS_ENABLED=true" --output none

          $defaultHostName = (az webapp show --resource-group $resourceGroup --name $env:WEB_APP_NAME --query defaultHostName --output tsv).Trim()
          if ([string]::IsNullOrWhiteSpace($defaultHostName)) {
            throw "Azure did not return a default hostname for '$env:WEB_APP_NAME'."
          }

          "WEB_APP_RESOURCE_GROUP=$resourceGroup" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WEB_APP_HOSTNAME=$defaultHostName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEB_APP_NAME }}
          slot-name: Production
          package: deployment/ctship-app.zip

      - name: Restart Azure Web App
        shell: pwsh
        run: az webapp restart --resource-group $env:WEB_APP_RESOURCE_GROUP --name $env:WEB_APP_NAME

      - name: Verify application and database health
        shell: pwsh
        run: |
          $aliveUrl = "https://$env:WEB_APP_HOSTNAME/alive"
          $healthUrl = "https://$env:WEB_APP_HOSTNAME/health"
          $loginUrl = "https://$env:WEB_APP_HOSTNAME/Identity/Account/Login"

          Write-Host "Waiting for Azure App Service startup..."
          Start-Sleep -Seconds 45

          for ($attempt = 1; $attempt -le 30; $attempt++) {

            Write-Host ""
            Write-Host "Verification attempt $attempt of 30"

            try {
              $aliveResponse = Invoke-WebRequest `
                -Uri $aliveUrl `
                -UseBasicParsing `
                -TimeoutSec 45

              Write-Host "Alive: HTTP $($aliveResponse.StatusCode)"
              Write-Host "Alive body: '$($aliveResponse.Content)'"

              if ($aliveResponse.StatusCode -ne 200) {
                Start-Sleep -Seconds 10
                continue
              }

              $healthResponse = Invoke-WebRequest `
                -Uri $healthUrl `
                -UseBasicParsing `
                -TimeoutSec 45

              Write-Host "Health: HTTP $($healthResponse.StatusCode)"
              Write-Host "Health body: '$($healthResponse.Content)'"

              if ($healthResponse.StatusCode -ne 200) {
                Start-Sleep -Seconds 10
                continue
              }

              $loginResponse = Invoke-WebRequest `
                -Uri $loginUrl `
                -UseBasicParsing `
                -TimeoutSec 45

              Write-Host "Login: HTTP $($loginResponse.StatusCode)"

              if ($loginResponse.StatusCode -ne 200) {
                Start-Sleep -Seconds 10
                continue
              }

              Write-Host ""
              Write-Host "======================================"
              Write-Host "CTSHIP deployment verification PASSED"
              Write-Host "Alive endpoint: 200"
              Write-Host "Database health: 200"
              Write-Host "Login page: 200"
              Write-Host "======================================"

              exit 0
            }
            catch {
              $statusCode = "unavailable"

              if ($null -ne $_.Exception.Response) {
                try {
                  $statusCode = [int]$_.Exception.Response.StatusCode
                }
                catch {
                  $statusCode = "unavailable"
                }
              }
