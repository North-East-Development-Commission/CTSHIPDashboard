name: Build and deploy ASP.NET Core app to Azure Web App - ctship-app

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  DOTNET_VERSION: '9.0.x'
  WEB_APP_NAME: 'ctship-app'
  PUBLISH_RUNTIME: 'win-x86'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore .\CTSHIPDashboard.csproj --runtime ${{ env.PUBLISH_RUNTIME }}

      - name: Publish self-contained Windows x86 package
        shell: pwsh
        run: |
          $publishPath = "${{ runner.temp }}/publish"
          dotnet publish .\CTSHIPDashboard.csproj `
            --configuration Release `
            --runtime $env:PUBLISH_RUNTIME `
            --self-contained true `
            --no-restore `
            --output $publishPath

      - name: Validate publish output
        shell: pwsh
        run: |
          $publishPath = "${{ runner.temp }}/publish"
          $requiredFiles = @(
            "web.config",
            "CTSHIPDashboard.exe",
            "CTSHIPDashboard.dll",
            "CTSHIPDashboard.runtimeconfig.json",
            "hostfxr.dll"
          )

          foreach ($file in $requiredFiles) {
            $filePath = Join-Path $publishPath $file
            if (-not (Test-Path -LiteralPath $filePath -PathType Leaf)) {
              throw "Publish output is missing required root file: $file"
            }
          }

          $webConfig = Get-Content -LiteralPath (Join-Path $publishPath "web.config") -Raw
          if ($webConfig -notmatch 'processPath="\.\\CTSHIPDashboard\.exe"') {
            throw "web.config does not point IIS to CTSHIPDashboard.exe."
          }

          Write-Host "Publish output contains CTSHIPDashboard.exe, hostfxr.dll, and a valid Azure web.config."

      - name: Package Azure deployment
        shell: pwsh
        run: Compress-Archive -Path "${{ runner.temp }}/publish/*" -DestinationPath "${{ runner.temp }}/ctship-app.zip" -Force

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: ctship-app
          path: ${{ runner.temp }}/ctship-app.zip

  deploy:
    runs-on: windows-latest
    needs: build
    environment:
      name: production
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: ctship-app
          path: deployment

      - name: Inspect downloaded deployment package
        shell: pwsh
        run: |
          $packagePath = Join-Path $PWD "deployment/ctship-app.zip"
          if (-not (Test-Path -LiteralPath $packagePath -PathType Leaf)) {
            throw "Deployment package was not downloaded to: $packagePath"
          }

          $inspectPath = Join-Path $env:RUNNER_TEMP "ctship-package-inspect"
          if (Test-Path -LiteralPath $inspectPath) {
            Remove-Item -LiteralPath $inspectPath -Recurse -Force
          }
          New-Item -ItemType Directory -Path $inspectPath | Out-Null
          Expand-Archive -LiteralPath $packagePath -DestinationPath $inspectPath -Force

          Write-Host "Deployment package root files:"
          Get-ChildItem -LiteralPath $inspectPath -File | Select-Object Name,Length | Format-Table -AutoSize

          $requiredFiles = @(
            "web.config",
            "CTSHIPDashboard.exe",
            "CTSHIPDashboard.dll",
            "CTSHIPDashboard.deps.json",
            "CTSHIPDashboard.runtimeconfig.json",
            "hostfxr.dll"
          )

          foreach ($file in $requiredFiles) {
            if (-not (Test-Path -LiteralPath (Join-Path $inspectPath $file) -PathType Leaf)) {
              throw "Downloaded deployment package is missing required root file: $file"
            }
          }

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.CTSHIPDASHBOARD_SPN }}

      - name: Configure Azure Web App
        shell: pwsh
        env:
          AZURE_SQL_CONNECTION_STRING: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AZURE_SQL_CONNECTION_STRING)) {
            throw "Repository secret AZURE_SQL_CONNECTION_STRING is required."
          }

          $effectiveConnectionString = $env:AZURE_SQL_CONNECTION_STRING.Trim()
          $effectiveConnectionString = $effectiveConnectionString.Replace('Authentication="Active Directory Default"', 'Authentication=Active Directory Managed Identity')
          $effectiveConnectionString = $effectiveConnectionString.Replace('Authentication=Active Directory Default', 'Authentication=Active Directory Managed Identity')
          $effectiveConnectionString = $effectiveConnectionString.Replace('Authentication="Active Directory Managed Identity"', 'Authentication=Active Directory Managed Identity')
          $resourceGroup = az webapp list --query "[?name=='$env:WEB_APP_NAME'].resourceGroup | [0]" --output tsv
          if ([string]::IsNullOrWhiteSpace($resourceGroup)) {
            throw "Azure Web App '$env:WEB_APP_NAME' was not found."
          }

          az webapp config set `
            --resource-group $resourceGroup `
            --name $env:WEB_APP_NAME `
            --net-framework-version "v9.0" `
            --always-on true `
            --http20-enabled true `
            --use-32bit-worker-process true `
            --output none

          az webapp update `
            --resource-group $resourceGroup `
            --name $env:WEB_APP_NAME `
            --https-only true `
            --output none

          az webapp config connection-string set `
            --resource-group $resourceGroup `
            --name $env:WEB_APP_NAME `
            --connection-string-type SQLAzure `
            --settings "DefaultConnection=$effectiveConnectionString" `
            --output none

          az webapp config appsettings delete `
            --resource-group $resourceGroup `
            --name $env:WEB_APP_NAME `
            --setting-names WEBSITE_RUN_FROM_PACKAGE `
            --output none

          az webapp config appsettings set `
            --resource-group $resourceGroup `
            --name $env:WEB_APP_NAME `
            --settings `
              "ASPNETCORE_ENVIRONMENT=Production" `
              "ASPNETCORE_FORWARDEDHEADERS_ENABLED=true" `
              "ConnectionStrings__DefaultConnection=$effectiveConnectionString" `
              "Database__ApplyMigrationsOnStartup=false" `
              "SCM_DO_BUILD_DURING_DEPLOYMENT=false" `
            --output none

          $defaultHostName = (az webapp show --resource-group $resourceGroup --name $env:WEB_APP_NAME --query defaultHostName --output tsv).Trim()
          if ([string]::IsNullOrWhiteSpace($defaultHostName)) {
          $scmHostName = $env:WEB_APP_HOSTNAME -replace '^([^.]+)\.', '$1.scm.'
          $kuduBaseUrl = "https://$scmHostName"
          }

          "WEB_APP_RESOURCE_GROUP=$resourceGroup" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "WEB_APP_HOSTNAME=$defaultHostName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Deploy zip package to Azure Web App
        id: deploy-to-webapp
        shell: pwsh
        run: |
          $packagePath = Join-Path $PWD "deployment/ctship-app.zip"
          if (-not (Test-Path -LiteralPath $packagePath -PathType Leaf)) {
            throw "Deployment package was not found: $packagePath"
          }

          az webapp deploy `
            --resource-group $env:WEB_APP_RESOURCE_GROUP `
            --name $env:WEB_APP_NAME `
            --src-path $packagePath `
            --type zip `
            --clean true `
            --restart true `
            --output json

          $defaultHostName = (az webapp show --resource-group $env:WEB_APP_RESOURCE_GROUP --name $env:WEB_APP_NAME --query defaultHostName --output tsv).Trim()
          "webapp-url=https://$defaultHostName" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Inspect deployed Azure wwwroot files
        shell: pwsh
        run: |
          $credentials = az webapp deployment list-publishing-credentials `
            --resource-group $env:WEB_APP_RESOURCE_GROUP `
            --name $env:WEB_APP_NAME `
            --query "{user:publishingUserName,password:publishingPassword}" `
            --output json | ConvertFrom-Json

          $pair = "$($credentials.user):$($credentials.password)"
          $encoded = [Convert]::ToBase64String([Text.Encoding]::ASCII.GetBytes($pair))
          $headers = @{ Authorization = "Basic $encoded" }
          $scmHostName = $env:WEB_APP_HOSTNAME -replace '^([^.]+)\.', '$1.scm.'
          $kuduBaseUrl = "https://$scmHostName"
          $wwwrootUrl = "$kuduBaseUrl/api/vfs/site/wwwroot/"

          Write-Host "Inspecting deployed files at $wwwrootUrl"
          $files = Invoke-RestMethod -Uri $wwwrootUrl -Headers $headers -Method Get
          $files | Select-Object name, size, mtime | Sort-Object name | Format-Table -AutoSize

          $fileNames = @($files | ForEach-Object { $_.name })
          $requiredFiles = @(
            "web.config",
            "CTSHIPDashboard.exe",
            "CTSHIPDashboard.dll",
            "CTSHIPDashboard.deps.json",
            "CTSHIPDashboard.runtimeconfig.json",
            "hostfxr.dll"
          )

          foreach ($file in $requiredFiles) {
            if ($fileNames -notcontains $file) {
              throw "Azure site/wwwroot is missing required deployed file: $file"
            }
          }

      - name: Inspect Azure Web App runtime settings
        shell: pwsh
        run: |
          az webapp config show `
            --resource-group $env:WEB_APP_RESOURCE_GROUP `
            --name $env:WEB_APP_NAME `
            --query "{linuxFxVersion:linuxFxVersion, netFrameworkVersion:netFrameworkVersion, use32BitWorkerProcess:use32BitWorkerProcess, alwaysOn:alwaysOn}" `
            --output json

          az webapp config appsettings list `
            --resource-group $env:WEB_APP_RESOURCE_GROUP `
            --name $env:WEB_APP_NAME `
            --query "[?name=='WEBSITE_RUN_FROM_PACKAGE' || name=='SCM_DO_BUILD_DURING_DEPLOYMENT' || name=='ASPNETCORE_FORWARDEDHEADERS_ENABLED' || name=='ASPNETCORE_ENVIRONMENT'].{name:name,value:value}" `
            --output table
      - name: Restart Azure Web App
        shell: pwsh
        run: az webapp restart --resource-group $env:WEB_APP_RESOURCE_GROUP --name $env:WEB_APP_NAME

      - name: Verify deployed ASP.NET Core app
        shell: pwsh
        run: |
          $aliveUrl = "https://$env:WEB_APP_HOSTNAME/alive"
          $healthUrl = "https://$env:WEB_APP_HOSTNAME/health"
          $loginUrl = "https://$env:WEB_APP_HOSTNAME/Identity/Account/Login"

          Write-Host "Waiting for Azure App Service restart..."
          Start-Sleep -Seconds 45

          for ($attempt = 1; $attempt -le 30; $attempt++) {
            Write-Host ""
            Write-Host "Verification attempt $attempt of 30"

            $aliveResponse = Invoke-WebRequest -Uri $aliveUrl -UseBasicParsing -TimeoutSec 45 -SkipHttpErrorCheck
            Write-Host "Alive: HTTP $($aliveResponse.StatusCode), bytes=$($aliveResponse.RawContentLength), body='$($aliveResponse.Content)'"

            if ($aliveResponse.StatusCode -ne 200 -or $aliveResponse.Content -notmatch '"status"\s*:\s*"alive"') {
              Start-Sleep -Seconds 10
              continue
            }

            $healthResponse = Invoke-WebRequest -Uri $healthUrl -UseBasicParsing -TimeoutSec 45 -SkipHttpErrorCheck
            Write-Host "Health: HTTP $($healthResponse.StatusCode), bytes=$($healthResponse.RawContentLength), body='$($healthResponse.Content)'"

            if ($healthResponse.StatusCode -ne 200) {
              Start-Sleep -Seconds 10
              continue
            }

            $loginResponse = Invoke-WebRequest -Uri $loginUrl -UseBasicParsing -TimeoutSec 45 -SkipHttpErrorCheck
            Write-Host "Login: HTTP $($loginResponse.StatusCode), bytes=$($loginResponse.RawContentLength), body='$($loginResponse.Content)'"

            if ($loginResponse.StatusCode -eq 200 -and $loginResponse.Content -match 'id="account"|id="login-submit"|LOGIN') {
              Write-Host "CTSHIP deployment verification PASSED."
              exit 0
            }

            if ($loginResponse.StatusCode -eq 200) {
              Write-Host "Login returned HTTP 200 but did not contain the expected login form markup. The response body is not a valid rendered login page yet."
            }

            Start-Sleep -Seconds 10
          }

          throw "Application did not become healthy after deployment."

