name: Build and deploy ASP.NET Core app to Azure Web App - ctship-app

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  DOTNET_VERSION: '9.0.x'
  WEB_APP_NAME: 'ctship-app'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Publish
        run: dotnet publish --configuration Release --no-build --output "${{ runner.temp }}/publish"

      - name: Package Azure deployment
        shell: pwsh
        run: Compress-Archive -Path "${{ runner.temp }}/publish/*" -DestinationPath "${{ runner.temp }}/ctship-app.zip" -Force

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{ runner.temp }}/ctship-app.zip

  deploy:
    runs-on: windows-latest
    needs: build
    environment:
      name: production
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      contents: read

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: deployment

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.CTSHIPDASHBOARD_SPN }}

      - name: Configure Azure SQL and migration settings
        shell: pwsh
        env:
          AZURE_SQL_CONNECTION_STRING: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:AZURE_SQL_CONNECTION_STRING)) {
            throw "Repository secret AZURE_SQL_CONNECTION_STRING is required."
          }

          $resourceGroup = az webapp list --query "[?name=='$env:WEB_APP_NAME'].resourceGroup | [0]" --output tsv
          if ([string]::IsNullOrWhiteSpace($resourceGroup)) {
            throw "Azure Web App '$env:WEB_APP_NAME' was not found."
          }

          az webapp config set --resource-group $resourceGroup --name $env:WEB_APP_NAME --net-framework-version "v9.0" --always-on true --http20-enabled true --output none
          az webapp update --resource-group $resourceGroup --name $env:WEB_APP_NAME --https-only true --output none
          az webapp config connection-string set --resource-group $resourceGroup --name $env:WEB_APP_NAME --connection-string-type SQLAzure --settings "DefaultConnection=$env:AZURE_SQL_CONNECTION_STRING" --output none
          az webapp config appsettings set --resource-group $resourceGroup --name $env:WEB_APP_NAME --settings "ASPNETCORE_ENVIRONMENT=Production" "Database__ApplyMigrationsOnStartup=true" "ASPNETCORE_FORWARDEDHEADERS_ENABLED=true" --output none

          $defaultHostName = (az webapp show --resource-group $resourceGroup --name $env:WEB_APP_NAME --query defaultHostName --output tsv).Trim()
          if ([string]::IsNullOrWhiteSpace($defaultHostName)) {
            throw "Azure did not return a default hostname for '$env:WEB_APP_NAME'."
          }

          "WEB_APP_HOSTNAME=$defaultHostName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEB_APP_NAME }}
          slot-name: Production
          package: deployment/ctship-app.zip

      - name: Verify application and database health
        shell: pwsh
        run: |
          $healthUrl = "https://$env:WEB_APP_HOSTNAME/health"
          for ($attempt = 1; $attempt -le 12; $attempt++) {
            try {
              $response = Invoke-WebRequest -Uri $healthUrl -UseBasicParsing -TimeoutSec 30
              $hasHealthyPayload = $response.Content -match '"status"\s*:\s*"healthy"'
              if ($response.StatusCode -eq 200 -and $hasHealthyPayload) {
                $loginUrl = "https://$env:WEB_APP_HOSTNAME/Identity/Account/Login"
                $loginResponse = Invoke-WebRequest -Uri $loginUrl -UseBasicParsing -TimeoutSec 30
                $hasLoginPage = $loginResponse.Content -match '<form'

                if ($loginResponse.StatusCode -eq 200 -and $hasLoginPage) {
                  Write-Host "Application, Azure SQL, and login page are healthy."
                  exit 0
                }

                Write-Host "Login page validation failed (HTTP $($loginResponse.StatusCode), bytes=$($loginResponse.RawContentLength))."
              }

              Write-Host "Health endpoint returned HTTP $($response.StatusCode), bytes=$($response.RawContentLength), body=$($response.Content)"
            }
            catch {
              $statusCode = if ($null -ne $_.Exception.Response) {
                [int]$_.Exception.Response.StatusCode
              } else {
                "unavailable"
              }
              Write-Host "Health check attempt $attempt failed for $healthUrl (HTTP $statusCode): $($_.Exception.Message)"
            }

            Start-Sleep -Seconds 10
          }

          throw "Application health check failed after deployment: $healthUrl"
